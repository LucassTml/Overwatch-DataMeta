<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Knowledge Graph — Overwatch 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root{
    --bg:#080b10;
    --bg-panel:#10161f;
    --bg-panel-2:#161e2a;
    --line:#22303f;
    --text:#eef2f6;
    --text-dim:#7c8b9c;
    --orange:#ff9d1a;
    --cyan:#3ad6ff;
    --green:#7fd858;
    --purple:#b98aff;
    --gold:#ffd75e;
    --pink:#ff5c7a;
    --grey:#6e7d8d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;overflow:hidden;}

  .app{position:relative;width:100vw;height:100vh;}

  .app::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(58,214,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(58,214,255,0.04) 1px, transparent 1px);
    background-size: 42px 42px;
  }

  svg{position:absolute;inset:0;width:100%;height:100%;cursor:grab;z-index:1;}
  svg:active{cursor:grabbing;}

  /* ---------- topo ---------- */
  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:5;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 22px;
    background:linear-gradient(180deg, rgba(8,11,16,0.95), rgba(8,11,16,0.0));
    pointer-events:none;
  }
  .topbar > *{pointer-events:auto;}
  .brand{display:flex;flex-direction:column;line-height:1;margin-right:8px;}
  .brand .eyebrow{font-family:'Rajdhani';font-size:11px;letter-spacing:.28em;color:var(--orange);font-weight:700;}
  .brand h1{font-family:'Orbitron';font-size:19px;margin:2px 0 0;letter-spacing:.03em;font-weight:800;
    background:linear-gradient(90deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;}

  .search-wrap{position:relative;flex:0 0 220px;}
  .search-wrap input{
    width:100%;background:var(--bg-panel);border:1px solid var(--line);color:var(--text);
    font-family:'Rajdhani';font-weight:600;font-size:14px;padding:9px 12px 9px 34px;
    clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 10px);
    outline:none;
  }
  .search-wrap input:focus{border-color:var(--cyan);}
  .search-wrap svg.icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text-dim);}
  .search-wrap input::placeholder{color:var(--text-dim);}

  .chip-row{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    font-family:'Rajdhani';font-weight:700;font-size:12px;letter-spacing:.02em;
    padding:6px 12px;border:1px solid var(--line);background:var(--bg-panel);color:var(--text-dim);
    cursor:pointer;user-select:none;
    clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);
    transition:all .15s ease;
  }
  .chip.on{color:#0a0e14;border-color:transparent;}
  .chip:hover{filter:brightness(1.15);}

  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;}
  .btn{
    font-family:'Rajdhani';font-weight:700;font-size:12.5px;letter-spacing:.02em;
    padding:8px 13px;border:1px solid var(--line);background:var(--bg-panel);color:var(--text);
    cursor:pointer;display:flex;align-items:center;gap:6px;
    clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);
    transition:all .15s ease;
  }
  .btn:hover{border-color:var(--cyan);color:var(--cyan);}
  .btn.primary{background:var(--orange);color:#0a0e14;border-color:transparent;}
  .btn.primary:hover{filter:brightness(1.1);color:#0a0e14;}
  .btn.danger{background:transparent;border-color:var(--pink);color:var(--pink);}
  .btn.danger:hover{background:var(--pink);color:#0a0e14;}
  .btn.small{padding:5px 9px;font-size:11px;}

  .helptext{
    position:absolute;bottom:16px;left:22px;z-index:5;
    font-size:12px;color:var(--text-dim);font-family:'Rajdhani';font-weight:600;
    background:rgba(16,22,31,0.7);padding:8px 12px;
    clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);
    border:1px solid var(--line);
  }
  .helptext b{color:var(--text);}

  /* ---------- legenda ---------- */
  .legend{
    position:absolute;bottom:16px;right:16px;z-index:5;
    background:rgba(16,22,31,0.85);border:1px solid var(--line);
    padding:12px 14px;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    font-size:12px;
  }
  .legend .title{font-family:'Orbitron';font-size:10px;letter-spacing:.15em;color:var(--text-dim);margin-bottom:8px;}
  .legend-row{display:flex;align-items:center;gap:8px;margin:4px 0;font-weight:600;}
  .swatch{width:11px;height:11px;flex:0 0 auto;}
  .swatch.hex{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);}

  /* ---------- painel lateral ---------- */
  .panel{
    position:absolute;top:0;right:0;height:100%;width:340px;z-index:10;
    background:var(--bg-panel);border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
    display:flex;flex-direction:column;
  }
  .panel.open{transform:translateX(0);}
  .panel-head{
    padding:20px 20px 14px;border-bottom:1px solid var(--line);position:relative;
    background:var(--bg-panel-2);
  }
  .panel-head::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--type-color,var(--orange));
  }
  .panel-close{
    position:absolute;top:14px;right:14px;background:none;border:none;color:var(--text-dim);
    font-size:18px;cursor:pointer;font-family:'Rajdhani';
  }
  .panel-close:hover{color:var(--text);}
  .panel-type{
    display:inline-block;font-family:'Orbitron';font-size:10px;letter-spacing:.12em;
    padding:3px 9px;color:#0a0e14;background:var(--type-color,var(--orange));margin-bottom:10px;
  }
  .panel-head h2{margin:0;font-family:'Orbitron';font-size:20px;font-weight:800;}
  .panel-body{padding:16px 20px;overflow-y:auto;flex:1;}
  .panel-section{margin-bottom:18px;}
  .panel-section .label{font-family:'Orbitron';font-size:10px;letter-spacing:.15em;color:var(--text-dim);margin-bottom:8px;}
  .prop-line{font-size:14px;margin-bottom:6px;color:var(--text-dim);}
  .prop-line b{color:var(--text);font-weight:600;}
  .panel-footer{padding:14px 20px;border-top:1px solid var(--line);}

  .rel-group{margin-bottom:12px;}
  .rel-group .rel-type{font-family:'Rajdhani';font-weight:700;font-size:12px;margin-bottom:6px;
    display:flex;align-items:center;gap:6px;}
  .rel-dot{width:8px;height:8px;border-radius:50%;}
  .rel-item{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:7px 10px;background:var(--bg);border:1px solid var(--line);margin-bottom:5px;
    font-size:13px;font-weight:600;transition:border-color .15s;
  }
  .rel-item .rel-main{cursor:pointer;flex:1;}
  .rel-item:hover{border-color:var(--cyan);}
  .rel-item .motivo{display:block;font-size:11px;font-weight:500;color:var(--text-dim);margin-top:3px;}
  .rel-item .rel-del{color:var(--text-dim);flex:0 0 auto;cursor:pointer;font-size:14px;padding:0 2px;}
  .rel-item .rel-del:hover{color:var(--pink);}

  /* ---------- modal ---------- */
  .modal-overlay{
    position:absolute;inset:0;z-index:20;background:rgba(4,6,9,0.72);
    display:none;align-items:center;justify-content:center;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    width:380px;max-height:82vh;overflow-y:auto;background:var(--bg-panel);border:1px solid var(--line);
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  }
  .modal-head{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--bg-panel-2);
    font-family:'Orbitron';font-size:14px;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center;}
  .modal-head button{background:none;border:none;color:var(--text-dim);font-size:16px;cursor:pointer;}
  .modal-body{padding:18px 20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;font-family:'Orbitron';letter-spacing:.1em;color:var(--text-dim);margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
    font-family:'Rajdhani';font-weight:600;font-size:14px;padding:8px 10px;outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--cyan);}
  .field textarea{resize:vertical;min-height:56px;font-weight:500;}
  .field .hint{font-size:11px;color:var(--text-dim);margin-top:4px;font-weight:500;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
  .error-msg{color:var(--pink);font-size:12px;font-weight:700;margin-top:8px;display:none;}
  .error-msg.show{display:block;}

  /* ---------- nodes/links ---------- */
  .link{fill:none;}
  .link.counter{stroke:var(--pink);stroke-width:1.6;}
  .link.sinergia{stroke:var(--green);stroke-width:1.6;}
  .link.estrutural{stroke:var(--line);stroke-width:1;}
  .link.dim{opacity:0.06;}
  .link.hi{opacity:1;}

  .node-label{font-family:'Rajdhani';font-weight:700;fill:var(--text);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px;}
  .node-label.small{font-size:9px;font-weight:600;fill:var(--text-dim);}
  .node-shape{stroke:#0a0e14;stroke-width:1.3px;cursor:pointer;}
  .node-shape.dim{opacity:0.12;}
  .node-shape.selected{stroke:#fff;stroke-width:2.5px;}
  .node-group.dim .node-label{opacity:0.10;}

  .toast{
    position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:30;
    background:var(--bg-panel);border:1px solid var(--cyan);color:var(--text);
    padding:9px 16px;font-family:'Rajdhani';font-weight:700;font-size:13px;
    clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="app">
  <svg id="canvas"></svg>

  <div class="topbar">
    <div class="brand">
      <span class="eyebrow">KNOWLEDGE GRAPH</span>
      <h1>OVERWATCH // TÁTICAS</h1>
    </div>
    <div class="search-wrap">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="Buscar herói, classe, mapa...">
    </div>
    <div class="chip-row" id="type-chips"></div>
    <div class="chip-row" id="rel-chips"></div>
    <div class="actions">
      <button class="btn primary" id="btn-add-node">+ Nó</button>
      <button class="btn" id="btn-add-edge">+ Relação</button>
      <button class="btn" id="btn-export">⭳ Exportar</button>
      <button class="btn" id="btn-import">⭱ Importar</button>
      <button class="btn" id="btn-reset">↺ Restaurar</button>
      <input type="file" id="file-import" accept="application/json" style="display:none;">
    </div>
  </div>

  <div class="helptext">
    <b>Arraste</b> para mover · <b>Scroll</b> para zoom · <b>Clique</b> num nó para detalhes e editar
  </div>

  <div class="legend" id="legend"></div>

  <div class="panel" id="panel">
    <div class="panel-head">
      <button class="panel-close" id="panel-close">✕</button>
      <div class="panel-type" id="panel-type">TIPO</div>
      <h2 id="panel-name">Nome</h2>
    </div>
    <div class="panel-body" id="panel-body"></div>
    <div class="panel-footer">
      <button class="btn danger" id="btn-remove-node" style="width:100%;justify-content:center;">🗑 Remover este nó</button>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

function slugifyNode(text) {
  return text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9_]/g, '');
}

novosDados.forEach(d => {
  const idHeroi = "heroi_" + slugifyNode(d.heroi);
  const idClasse = "classe_" + slugifyNode(d.classe);
  const idSub = "sub_" + slugifyNode(d.subclasse);
  const idNac = d.nac ? "nac_" + slugifyNode(d.nac) : null;
  const idOrg = d.org ? "org_" + slugifyNode(d.org) : null;
  const idHab = "habilidade_" + slugifyNode(d.heroi);

  function addNo(id, tipo, nome) {
    if (!RAW_DATA.nos.find(n => n.id === id)) {
      RAW_DATA.nos.push({ id, tipo, nome, propriedades: {} });
    }
  }
  function addAresta(origem, destino, tipo) {
    if (destino && !RAW_DATA.arestas.find(a => a.origem === origem && a.destino === destino && a.tipo === tipo)) {
      RAW_DATA.arestas.push({ origem, destino, tipo, propriedades: {} });
    }
  }

  addNo(idHeroi, "Heroi", d.heroi);
  addNo(idClasse, "Classe", d.classe);
  addNo(idSub, "Subclasse", d.subclasse);
  if (d.nac) addNo(idNac, "Nacionalidade", d.nac);
  if (d.org) addNo(idOrg, "Organizacao", d.org);

  addNo(idHab, "Habilidade", "Kit: " + d.heroi);
  const noHab = RAW_DATA.nos.find(n => n.id === idHab);
  noHab.propriedades.centrais = d.habs;

  addAresta(idHeroi, idClasse, "PERTENCE_CLASSE");
  addAresta(idHeroi, idSub, "TEM_SUBCLASSE");
  if (d.nac) addAresta(idHeroi, idNac, "NACIONALIDADE");
  if (d.org) addAresta(idHeroi, idOrg, "MEMBRO_DE");
  addAresta(idHeroi, idHab, "TEM_HABILIDADE");
  addAresta(idSub, idClasse, "SUBCLASSE_DE");
});

// ---------- config visual por tipo de nó ----------
const TYPE_COLOR = {
  Heroi: '#ff9d1a',
  Classe: '#3ad6ff',
  Subclasse: '#7fd858',
  Mapa: '#b98aff',
  Nacionalidade: '#ffd75e',
  Organizacao: '#ff5c7a',
  Habilidade: '#6e7d8d',
};
const TYPE_LABEL = {
  Heroi: 'HERÓI', Classe: 'CLASSE', Subclasse: 'SUBCLASSE', Mapa: 'MAPA',
  Nacionalidade: 'NACIONALIDADE', Organizacao: 'ORGANIZAÇÃO', Habilidade: 'HABILIDADE',
};
const TYPE_RADIUS = { Heroi: 15, Classe: 13, Subclasse: 10, Mapa: 7, Nacionalidade: 7, Organizacao: 8, Habilidade: 6 };
const DEFAULT_RADIUS = 8, DEFAULT_COLOR = '#9aa7b5';

const REL_LABEL = {
  COUNTER: 'COUNTER', SINERGIA: 'SINERGIA', PERTENCE_CLASSE: 'classe',
  TEM_SUBCLASSE: 'subclasse', SUBCLASSE_DE: 'subclasse de', NACIONALIDADE: 'nacionalidade',
  TEM_HABILIDADE: 'habilidade', MEMBRO_DE: 'organização', JOGAVEL_EM: 'mapa',
};
const REL_TYPES = ['COUNTER','SINERGIA','PERTENCE_CLASSE','TEM_SUBCLASSE','SUBCLASSE_DE','NACIONALIDADE','TEM_HABILIDADE','MEMBRO_DE','JOGAVEL_EM'];

function typeColor(t){ return TYPE_COLOR[t] || DEFAULT_COLOR; }
function typeRadius(t){ return TYPE_RADIUS[t] || DEFAULT_RADIUS; }

function relClass(tipo){
  if (tipo === 'COUNTER') return 'counter';
  if (tipo === 'SINERGIA') return 'sinergia';
  return 'estrutural';
}

// ---------- estado dos filtros ----------
const typeState = { Heroi:true, Classe:true, Subclasse:true, Mapa:false, Nacionalidade:false, Organizacao:false, Habilidade:false };
const relState = { COUNTER:true, SINERGIA:true, ESTRUTURAL:true };
let searchTerm = '';
let selectedId = null;

let nodesById = {};
function reindexNodes(){
  nodesById = {};
  RAW_DATA.nos.forEach(n => nodesById[n.id] = n);
}
reindexNodes();

// ---------- chips de tipo (dinâmico, cobre também tipos customizados) ----------
const typeChipsEl = document.getElementById('type-chips');
function renderTypeChips(){
  const knownTypes = Object.keys(typeState);
  const customTypes = [...new Set(RAW_DATA.nos.map(n => n.tipo))].filter(t => !knownTypes.includes(t));
  customTypes.forEach(t => { if (!(t in typeState)) typeState[t] = true; });

  typeChipsEl.innerHTML = '';
  [...knownTypes, ...customTypes].forEach(t => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (typeState[t] ? ' on' : '');
    chip.textContent = TYPE_LABEL[t] || t.toUpperCase();
    chip.style.background = typeState[t] ? typeColor(t) : '';
    chip.onclick = () => {
      typeState[t] = !typeState[t];
      chip.classList.toggle('on');
      chip.style.background = typeState[t] ? typeColor(t) : '';
      rebuild();
    };
    typeChipsEl.appendChild(chip);
  });
}

const relChipsEl = document.getElementById('rel-chips');
const relColors = { COUNTER: '#ff5c7a', SINERGIA: '#7fd858', ESTRUTURAL: '#7c8b9c' };
Object.keys(relState).forEach(r => {
  const chip = document.createElement('div');
  chip.className = 'chip on';
  chip.textContent = r;
  chip.style.background = relColors[r];
  chip.onclick = () => {
    relState[r] = !relState[r];
    chip.classList.toggle('on');
    chip.style.background = relState[r] ? relColors[r] : '';
    rebuild();
  };
  relChipsEl.appendChild(chip);
});

// ---------- legenda ----------

  const allTypes = [...new Set(RAW_DATA.nos.map(n => n.tipo))];
  legendEl.innerHTML = '<div class="title">TIPOS DE NÓ</div>' +
    allTypes.map(t =>
      `<div class="legend-row"><span class="swatch ${t==='Heroi'?'hex':''}" style="background:${typeColor(t)}"></span>${TYPE_LABEL[t] || t.toUpperCase()}</div>`
    ).join('');
}

// ---------- toast ----------
let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- d3 setup ----------
const svg = d3.select('#canvas');
const container = svg.append('g');

svg.call(d3.zoom().scaleExtent([0.25, 4]).on('zoom', (ev) => {
  container.attr('transform', ev.transform);
}));

let width = window.innerWidth, height = window.innerHeight;
window.addEventListener('resize', () => {
  width = window.innerWidth; height = window.innerHeight;
  simulation.force('center', d3.forceCenter(width/2, height/2));
  simulation.alpha(0.3).restart();
});

const linkLayer = container.append('g').attr('class', 'links');
const nodeLayer = container.append('g').attr('class', 'nodes');

let simulation = d3.forceSimulation()
  .force('link', d3.forceLink().id(d => d.id).distance(d => d.tipo === 'COUNTER' || d.tipo === 'SINERGIA' ? 130 : 60).strength(0.5))
  .force('charge', d3.forceManyBody().strength(-260))
  .force('center', d3.forceCenter(width/2, height/2))
  .force('collide', d3.forceCollide(d => typeRadius(d.tipo) + 14));

let linkSel, nodeSel;
let currentNodes = [], currentLinks = [];
const posCache = {};

function visibleNodeIds(){
  return new Set(RAW_DATA.nos.filter(n => typeState[n.tipo]).map(n => n.id));
}

function rebuild(){
  renderTypeChips();
  renderLegend();
  const vis = visibleNodeIds();
  currentNodes = RAW_DATA.nos.filter(n => vis.has(n.id)).map(n => {
    const cached = posCache[n.id];
    return Object.assign({}, n, cached ? {x:cached.x, y:cached.y, vx:0, vy:0} : {});
  });
  currentLinks = RAW_DATA.arestas.filter(a => {
    if (!vis.has(a.origem) || !vis.has(a.destino)) return false;
    const cls = relClass(a.tipo);
    if (cls === 'counter') return relState.COUNTER;
    if (cls === 'sinergia') return relState.SINERGIA;
    return relState.ESTRUTURAL;
  }).map(a => Object.assign({}, a, {source: a.origem, target: a.destino}));

  draw();
}

function draw(){
  const term = searchTerm.trim().toLowerCase();

  linkSel = linkLayer.selectAll('path.link').data(currentLinks, d => d.origem+'|'+d.destino+'|'+d.tipo);
  linkSel.exit().remove();
  const linkEnter = linkSel.enter().append('path')
    .attr('class', d => 'link ' + relClass(d.tipo))
    .attr('marker-end', d => relClass(d.tipo) === 'counter' ? 'url(#arrow)' : null);
  linkSel = linkEnter.merge(linkSel);

  nodeSel = nodeLayer.selectAll('g.node-group').data(currentNodes, d => d.id);
  nodeSel.exit().remove();
  const nodeEnter = nodeSel.enter().append('g').attr('class', 'node-group');

  nodeEnter.each(function(d){
    const g = d3.select(this);
    const r = typeRadius(d.tipo);
    if (d.tipo === 'Heroi'){
      g.append('polygon')
        .attr('class', 'node-shape')
        .attr('points', hexPoints(r))
        .attr('fill', typeColor(d.tipo));
    } else {
      g.append('circle')
        .attr('class', 'node-shape')
        .attr('r', r)
        .attr('fill', typeColor(d.tipo));
    }
    g.append('text')
      .attr('class', 'node-label' + (d.tipo === 'Heroi' ? '' : ' small'))
      .attr('text-anchor', 'middle')
      .attr('y', r + (d.tipo === 'Heroi' ? 15 : 11))
      .text(d.nome);
  });

  nodeEnter.call(d3.drag()
    .on('start', dragStarted)
    .on('drag', dragged)
    .on('end', dragEnded));

  nodeEnter.on('click', (ev, d) => { ev.stopPropagation(); selectNode(d.id); });

  nodeSel = nodeEnter.merge(nodeSel);

  nodeSel.each(function(d){
    const g = d3.select(this);
    g.select('.node-shape').attr('fill', typeColor(d.tipo));
    g.select('.node-label').text(d.nome);
  });

  nodeSel.select('.node-shape')
    .classed('selected', d => d.id === selectedId)
    .classed('dim', d => {
      if (term && !d.nome.toLowerCase().includes(term)) return true;
      if (selectedId) return !isNeighbor(d.id);
      return false;
    });
  nodeSel.classed('dim', d => {
    if (term && !d.nome.toLowerCase().includes(term)) return true;
    if (selectedId) return !isNeighbor(d.id);
    return false;
  });

  linkSel.classed('dim', d => selectedId && d.origem !== selectedId && d.destino !== selectedId)
         .classed('hi', d => selectedId && (d.origem === selectedId || d.destino === selectedId));

  simulation.nodes(currentNodes).on('tick', ticked);
  simulation.force('link').links(currentLinks);
  simulation.alpha(0.6).restart();
}

function hexPoints(r){
  const pts = [];
  for (let i=0;i<6;i++){
    const ang = Math.PI/180 * (60*i - 30);
    pts.push([r*Math.cos(ang), r*Math.sin(ang)].join(','));
  }
  return pts.join(' ');
}

function isNeighbor(id){
  if (id === selectedId) return true;
  return currentLinks.some(l => (l.origem === selectedId && l.destino === id) || (l.destino === selectedId && l.origem === id));
}

function ticked(){
  currentNodes.forEach(n => { posCache[n.id] = {x:n.x, y:n.y}; });
  linkSel.attr('d', d => `M${d.source.x},${d.source.y} L${d.target.x},${d.target.y}`);
  nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
}

function dragStarted(ev, d){
  if (!ev.active) simulation.alphaTarget(0.25).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(ev, d){ d.fx = ev.x; d.fy = ev.y; }
function dragEnded(ev, d){
  if (!ev.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

svg.append('defs').append('marker')
  .attr('id', 'arrow').attr('viewBox', '0 -4 8 8').attr('refX', 22).attr('refY', 0)
  .attr('markerWidth', 6).attr('markerHeight', 6).attr('orient', 'auto')
  .append('path').attr('d', 'M0,-4L8,0L0,4').attr('fill', '#ff5c7a');

// ---------- painel lateral ----------
const panel = document.getElementById('panel');
document.getElementById('panel-close').onclick = () => deselect();
svg.on('click', () => deselect());

function deselect(){
  selectedId = null;
  panel.classList.remove('open');
  draw();
}

function selectNode(id){
  if (!nodesById[id]) { deselect(); return; }
  selectedId = id;
  const n = nodesById[id];
  document.getElementById('panel-type').textContent = TYPE_LABEL[n.tipo] || n.tipo.toUpperCase();
  document.getElementById('panel-type').style.setProperty('--type-color', typeColor(n.tipo));
  document.querySelector('.panel-head').style.setProperty('--type-color', typeColor(n.tipo));
  document.getElementById('panel-name').textContent = n.nome;

  const body = document.getElementById('panel-body');
  body.innerHTML = '';

  const propsKeys = Object.keys(n.propriedades || {});
  if (propsKeys.length){
    const sec = document.createElement('div');
    sec.className = 'panel-section';
    sec.innerHTML = '<div class="label">DETALHES</div>' + propsKeys.map(k =>
      `<div class="prop-line"><b>${k}:</b> ${n.propriedades[k]}</div>`).join('');
    body.appendChild(sec);
  }

  const outgoing = RAW_DATA.arestas.filter(a => a.origem === id);
  const incoming = RAW_DATA.arestas.filter(a => a.destino === id);

  const groups = {};
  outgoing.forEach(a => {
    const key = a.tipo;
    groups[key] = groups[key] || [];
    groups[key].push({ id: a.destino, motivo: a.propriedades && a.propriedades.motivo, origem: a.origem, destino: a.destino, tipo: a.tipo });
  });
  incoming.forEach(a => {
    const key = a.tipo + '_de';
    groups[key] = groups[key] || [];
    groups[key].push({ id: a.origem, motivo: a.propriedades && a.propriedades.motivo, origem: a.origem, destino: a.destino, tipo: a.tipo });
  });

  const order = ['COUNTER','SINERGIA','PERTENCE_CLASSE','TEM_SUBCLASSE','SUBCLASSE_DE','TEM_HABILIDADE','NACIONALIDADE','MEMBRO_DE','JOGAVEL_EM'];
  const sortedKeys = Object.keys(groups).sort((a,b) => order.indexOf(a.replace('_de','')) - order.indexOf(b.replace('_de','')));

  sortedKeys.forEach(key => {
    const baseTipo = key.replace('_de','');
    const isIncoming = key.endsWith('_de') && key !== 'SUBCLASSE_DE';
    const label = isIncoming ? (REL_LABEL[baseTipo] || baseTipo) + ' de' : (REL_LABEL[baseTipo] || baseTipo);
    const cls = relClass(baseTipo);
    const dotColor = cls === 'counter' ? '#ff5c7a' : cls === 'sinergia' ? '#7fd858' : '#7c8b9c';

    const sec = document.createElement('div');
    sec.className = 'rel-group';
    let html = `<div class="rel-type"><span class="rel-dot" style="background:${dotColor}"></span>${label.toUpperCase()}</div>`;
    groups[key].forEach(item => {
      const target = nodesById[item.id];
      if (!target) return;
      html += `<div class="rel-item">
        <span class="rel-main" data-target="${item.id}">${target.nome}${item.motivo ? `<span class="motivo">${item.motivo}</span>` : ''}</span>
        <span class="rel-del" data-origem="${item.origem}" data-destino="${item.destino}" data-tipo="${item.tipo}" title="Remover esta relação">✕</span>
      </div>`;
    });
    sec.innerHTML = html;
    body.appendChild(sec);
  });

  panel.querySelectorAll('.rel-main').forEach(el => {
    el.onclick = () => selectNode(el.getAttribute('data-target'));
  });
  panel.querySelectorAll('.rel-del').forEach(el => {
    el.onclick = (ev) => {
      ev.stopPropagation();
      removeEdge(el.getAttribute('data-origem'), el.getAttribute('data-destino'), el.getAttribute('data-tipo'));
      selectNode(id);
    };
  });

  panel.classList.add('open');
  draw();
}

document.getElementById('btn-remove-node').onclick = () => {
  if (!selectedId) return;
  const n = nodesById[selectedId];
  if (!confirm(`Remover o nó "${n.nome}" e todas as suas relações?`)) return;
  removeNode(selectedId);
};

// ============================================================
// OPERAÇÕES DE ESCRITA NO GRAFO (equivalentes ao GrafoConhecimento em Python)
// ============================================================

function slugify(texto){
  return texto.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
}

function gerarIdUnico(tipo, nome){
  const base = slugify(tipo) + '_' + slugify(nome);
  let id = base, i = 2;
  while (nodesById[id]) { id = base + '_' + i; i++; }
  return id;
}

function parsePropriedades(texto){
  const props = {};
  texto.split('\n').forEach(linha => {
    const idx = linha.indexOf(':');
    if (idx === -1) return;
    const chave = linha.slice(0, idx).trim();
    const valor = linha.slice(idx + 1).trim();
    if (chave) props[chave] = valor;
  });
  return props;
}

function addNode(tipo, nome, propriedades){
  const id = gerarIdUnico(tipo, nome);
  RAW_DATA.nos.push({ id, tipo, nome, propriedades: propriedades || {} });
  reindexNodes();
  rebuild();
  showToast(`Nó "${nome}" adicionado.`);
  return id;
}

function removeNode(id){
  RAW_DATA.nos = RAW_DATA.nos.filter(n => n.id !== id);
  RAW_DATA.arestas = RAW_DATA.arestas.filter(a => a.origem !== id && a.destino !== id);
  delete posCache[id];
  reindexNodes();
  deselect();
  rebuild();
  showToast('Nó removido.');
}

function addEdge(origem, destino, tipo, propriedades){
  RAW_DATA.arestas.push({ origem, destino, tipo, propriedades: propriedades || {} });
  rebuild();
  showToast(`Relação "${tipo}" adicionada.`);
}

function removeEdge(origem, destino, tipo){
  const antes = RAW_DATA.arestas.length;
  let removed = false;
  RAW_DATA.arestas = RAW_DATA.arestas.filter(a => {
    if (!removed && a.origem === origem && a.destino === destino && a.tipo === tipo){
      removed = true;
      return false;
    }
    return true;
  });
  rebuild();
  if (removed) showToast('Relação removida.');
}

function resetData(){
  if (!confirm('Restaurar o grafo para os dados originais? Todas as edições feitas na sessão serão perdidas.')) return;
  RAW_DATA.nos = JSON.parse(JSON.stringify(ORIGINAL_DATA.nos));
  RAW_DATA.arestas = JSON.parse(JSON.stringify(ORIGINAL_DATA.arestas));
  Object.keys(posCache).forEach(k => delete posCache[k]);
  reindexNodes();
  deselect();
  rebuild();
  showToast('Grafo restaurado ao original.');
}

function exportJSON(){
  const blob = new Blob([JSON.stringify({nos: RAW_DATA.nos, arestas: RAW_DATA.arestas}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'grafo_overwatch_editado.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importJSONFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data.nos) || !Array.isArray(data.arestas)) throw new Error('formato inválido');
      RAW_DATA.nos = data.nos;
      RAW_DATA.arestas = data.arestas;
      Object.keys(posCache).forEach(k => delete posCache[k]);
      reindexNodes();
      deselect();
      rebuild();
      showToast('Grafo importado com sucesso.');
    }catch(err){
      alert('Não foi possível importar o arquivo: ' + err.message);
    }
  };
  reader.readAsText(file);
}

document.getElementById('btn-export').onclick = exportJSON;
document.getElementById('btn-import').onclick = () => document.getElementById('file-import').click();
document.getElementById('file-import').addEventListener('change', (e) => {
  if (e.target.files[0]) importJSONFile(e.target.files[0]);
  e.target.value = '';
});
document.getElementById('btn-reset').onclick = resetData;

const modalOverlay = document.getElementById('modal-overlay');
const modalEl = document.getElementById('modal');

function closeModal(){ modalOverlay.classList.remove('open'); modalEl.innerHTML = ''; }
modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

function openModal(html){
  modalEl.innerHTML = html;
  modalOverlay.classList.add('open');
}

function allTypeOptions(){
  const knownTypes = Object.keys(TYPE_LABEL);
  const customTypes = [...new Set(RAW_DATA.nos.map(n => n.tipo))].filter(t => !knownTypes.includes(t));
  return [...knownTypes, ...customTypes];
}

document.getElementById('btn-add-node').onclick = () => {
  const typeOpts = allTypeOptions().map(t => `<option value="${t}">${TYPE_LABEL[t] || t}</option>`).join('');
  openModal(`
    <div class="modal-head"><span>ADICIONAR NÓ</span><button id="modal-x">✕</button></div>
    <div class="modal-body">
      <div class="field">
        <label>TIPO</label>
        <select id="f-tipo">${typeOpts}<option value="__novo__">+ Novo tipo...</option></select>
      </div>
      <div class="field" id="f-tipo-novo-wrap" style="display:none;">
        <label>NOME DO NOVO TIPO</label>
        <input id="f-tipo-novo" type="text" placeholder="ex: Ultimate">
      </div>
      <div class="field">
        <label>NOME</label>
        <input id="f-nome" type="text" placeholder="ex: Kiriko">
      </div>
      <div class="field">
        <label>PROPRIEDADES (opcional, uma por linha: chave: valor)</label>
        <textarea id="f-props" placeholder="passiva: Cura em área ao usar teletransporte"></textarea>
      </div>
      <div class="error-msg" id="f-error"></div>
      <div class="modal-actions">
        <button class="btn" id="modal-cancel">Cancelar</button>
        <button class="btn primary" id="modal-confirm">Adicionar</button>
      </div>
    </div>
  `);
  document.getElementById('modal-x').onclick = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('f-tipo').onchange = (e) => {
    document.getElementById('f-tipo-novo-wrap').style.display = e.target.value === '__novo__' ? 'block' : 'none';
  };
  document.getElementById('modal-confirm').onclick = () => {
    let tipo = document.getElementById('f-tipo').value;
    if (tipo === '__novo__') tipo = document.getElementById('f-tipo-novo').value.trim();
    const nome = document.getElementById('f-nome').value.trim();
    const errEl = document.getElementById('f-error');
    if (!tipo || !nome){
      errEl.textContent = 'Preencha tipo e nome.'; errEl.classList.add('show'); return;
    }
    const props = parsePropriedades(document.getElementById('f-props').value);
    const id = addNode(tipo, nome, props);
    closeModal();
    selectNode(id);
  };
};

document.getElementById('btn-add-edge').onclick = () => {
  const nodeOpts = RAW_DATA.nos.map(n => `<option value="${n.id}">${n.nome} (${TYPE_LABEL[n.tipo] || n.tipo})</option>`).join('');
  const relOpts = REL_TYPES.map(t => `<option value="${t}">${t}</option>`).join('');
  openModal(`
    <div class="modal-head"><span>ADICIONAR RELAÇÃO</span><button id="modal-x">✕</button></div>
    <div class="modal-body">
      <div class="field">
        <label>ORIGEM</label>
        <select id="f-origem">${nodeOpts}</select>
      </div>
      <div class="field">
        <label>TIPO DE RELAÇÃO</label>
        <select id="f-rel-tipo">${relOpts}<option value="__novo__">+ Novo tipo...</option></select>
      </div>
      <div class="field" id="f-rel-novo-wrap" style="display:none;">
        <label>NOME DA NOVA RELAÇÃO</label>
        <input id="f-rel-novo" type="text" placeholder="ex: RIVAL_DE">
      </div>
      <div class="field">
        <label>DESTINO</label>
        <select id="f-destino">${nodeOpts}</select>
      </div>
      <div class="field">
        <label>MOTIVO / OBSERVAÇÃO (opcional)</label>
        <input id="f-motivo" type="text" placeholder="ex: Hackear impede a fuga da sniper">
      </div>
      <div class="error-msg" id="f-error"></div>
      <div class="modal-actions">
        <button class="btn" id="modal-cancel">Cancelar</button>
        <button class="btn primary" id="modal-confirm">Adicionar</button>
      </div>
    </div>
  `);
  document.getElementById('modal-x').onclick = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('f-rel-tipo').onchange = (e) => {
    document.getElementById('f-rel-novo-wrap').style.display = e.target.value === '__novo__' ? 'block' : 'none';
  };
  document.getElementById('modal-confirm').onclick = () => {
    const origem = document.getElementById('f-origem').value;
    const destino = document.getElementById('f-destino').value;
    let tipo = document.getElementById('f-rel-tipo').value;
    if (tipo === '__novo__') tipo = document.getElementById('f-rel-novo').value.trim().toUpperCase().replace(/\s+/g,'_');
    const motivo = document.getElementById('f-motivo').value.trim();
    const errEl = document.getElementById('f-error');
    if (!origem || !destino || !tipo){
      errEl.textContent = 'Preencha origem, destino e tipo.'; errEl.classList.add('show'); return;
    }
    if (origem === destino){
      errEl.textContent = 'Origem e destino não podem ser o mesmo nó.'; errEl.classList.add('show'); return;
    }
    addEdge(origem, destino, tipo, motivo ? {motivo} : {});
    closeModal();
    selectNode(origem);
  };
};

rebuild();
